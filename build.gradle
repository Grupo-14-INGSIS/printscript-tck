plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
}

// Versión con timestamp
def timestamp = new Date().format("yyyyMMddHHmmss")
version = "1.0.${timestamp}"
group = "com.printscript"

// --- Cargar .env si existe ---
def dotenvFile = file("$rootDir/.env")
def dotenvProps = new Properties()
if (dotenvFile.exists()) {
    dotenvFile.withReader { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (!line.startsWith("#") && line.contains("=")) {
                def (key, value) = line.split("=", 2)
                dotenvProps.setProperty(key.trim(), value.trim())
            }
        }
    }
}

// --- Repositorios ---
repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GitHubPackages'
        url = uri("https://maven.pkg.github.com/Grupo-14-INGSIS/PrintScript-Tools")
        credentials {
            username = System.getenv("GITHUB_USER") ?: dotenvProps.getProperty("GITHUB_USER") ?: ""
            password = System.getenv("GITHUB_TOKEN") ?: dotenvProps.getProperty("GITHUB_TOKEN") ?: ""
        }
    }
}

// --- Dependencias ---
dependencies {
    // Core PrintScript modules desde GitHub Packages
    implementation 'IngsisTP:interpreter:1.0.60'
    implementation 'IngsisTP:lexer:1.0.60'
    implementation 'IngsisTP:linter:1.0.60'
    implementation 'IngsisTP:parser:1.0.60'
    implementation 'IngsisTP:formatter:1.0.60'
    implementation 'IngsisTP:ast:1.0.60'
    implementation 'IngsisTP:token:1.0.60'
    implementation 'IngsisTP:tokendata:1.0.60'
    implementation 'IngsisTP:container:1.0.60'
    implementation 'IngsisTP:executor:1.0.60'
    implementation 'IngsisTP:inputprovider:1.0.60'
    implementation 'IngsisTP:cli:1.0.60'

    // Opcionales
    implementation 'IngsisTP:analyzer:1.0.60'
    implementation 'IngsisTP:formatteraction:1.0.60'
    implementation 'IngsisTP:progress:1.0.60'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'

    // Agregar dependencias de test del TCK si existen
    testImplementation fileTree(dir: 'lib', include: '*.jar')

    // Kotlin (por si hace falta interoperabilidad)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'
}

// --- Configuración de Java ---
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// --- Configuración de tests mejorada ---
test {
    // Usar JUnit 4
    useJUnit()

    // Variables de entorno
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"

    // Configuración de logging para tests
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }

    // Aumentar memoria para tests
    jvmArgs '-Xmx1g'

    // Agregar el directorio de tests si existe
    if (file('src/test/java').exists()) {
        include '**/*Test.class'
        include '**/*Tests.class'
    }

    // Reporte de tests
    reports {
        html.required = true
        junitXml.required = true
    }

    // Continuar ejecutando tests aunque fallen algunos
    ignoreFailures = false

    // Configurar classpath de tests
    classpath = sourceSets.test.runtimeClasspath
}

// --- Tasks personalizadas ---
task testAdapter(type: JavaExec) {
    group = 'verification'
    description = 'Ejecuta tests del adapter manualmente'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'implementation.TestRunner'
}

task exploreClasses(type: JavaExec) {
    group = 'help'
    description = 'Explora las clases disponibles'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'implementation.ClassExplorer'
}

// --- Ejecutable principal ---
application {
    mainClass = 'implementation.TestRunner'
}

// --- Publicación a GitHub Packages ---
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.printscript'
            artifactId = 'printscript-tck'
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/Grupo-14-INGSIS/PrintScript-TCK")
            credentials {
                username = System.getenv("GITHUB_USER") ?: dotenvProps.getProperty("GITHUB_USER") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: dotenvProps.getProperty("GITHUB_TOKEN") ?: ""
            }
        }
    }
}

// --- Configuración adicional para debugging ---
tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
    options.encoding = 'UTF-8'
}

// --- Task para limpiar y verificar dependencias ---
task verifyDependencies {
    group = 'verification'
    description = 'Verifica que todas las dependencias estén disponibles'
    doLast {
        configurations.runtimeClasspath.files.each { file ->
            println "Dependency: ${file.name}"
        }
    }
}